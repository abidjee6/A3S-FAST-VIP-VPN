name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install and Setup Gradle 8.2
      run: |
        sudo rm -f /etc/apt/sources.list.d/*gradle* 2>/dev/null || true
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle-8.2-bin.zip || curl -sSL -o gradle-8.2-bin.zip https://downloads.gradle-dn.com/distributions/gradle-8.2-bin.zip
        sudo unzip -q gradle-8.2-bin.zip -d /opt/gradle
        echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build Android APK
      run: |
        export PATH="/opt/gradle/gradle-8.2/bin:$PATH"
        
        # پروجیکٹ کی سیٹنگز فائل تلاش کریں
        ROOT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -n "$ROOT_DIR" ]; then
          cd "$ROOT_DIR"
        fi

        gradle -v
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: A3S-Fast-VPN-Debug
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
