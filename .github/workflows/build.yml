name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Gradle
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gradle

    - name: Build Android APK
      run: |
        # تلاش کریں کہ پروجیکٹ کی سیٹنگز یا گریڈل فائل کس ڈائریکٹری میں ہے
        ROOT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -n "$ROOT_DIR" ]; then
          cd "$ROOT_DIR"
        fi
        
        # اگر ریپوزٹری میں ریپر اسکرپٹ موجود ہو تو اسے چلائیں، ورنہ سسٹم گریڈل استعمال کریں
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: A3S-Fast-VPN-Debug
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
